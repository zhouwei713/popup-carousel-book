<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旋转纸雕立体书</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
:root{--bg:#7b5437;--card:#fff7e6;--ink:#3a281b;--muted:#8a6a50;--accent:#e5603f}
@media (prefers-color-scheme:dark){:root{--bg:#2c1d14;--card:#3a2a1f;--ink:#f6e9d6;--muted:#c7a888;--accent:#f07a52}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:48px max(16px,env(safe-area-inset-left)) 48px max(16px,env(safe-area-inset-right))}
main{max-width:920px;margin:0 auto}
h1{font-family:"ZCOOL KuaiLe","PingFang SC",sans-serif;font-weight:400;font-size:44px;color:#fff3d6;margin:0 0 8px}
p.lead{color:#f3e2c4;margin:0 0 32px;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
a.card{display:block;background:var(--card);border-radius:18px;overflow:hidden;text-decoration:none;color:var(--ink);box-shadow:0 10px 28px rgba(30,15,5,.3);transition:transform .2s}
a.card:hover{transform:translateY(-3px)}
a.card img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
a.card div{padding:14px 18px 18px}
a.card b{font-family:"ZCOOL KuaiLe","PingFang SC",sans-serif;font-weight:400;font-size:24px}
a.card span{display:block;color:var(--muted);font-size:14px;margin-top:4px}
footer{margin-top:36px;color:#e9d3b0;font-size:14px}
footer a{color:#fff3d6}
</style>
</head>
<body>
<main>
<h1>旋转纸雕立体书</h1>
<p class="lead">给 Agent 一个故事主题，生成一本能转圈翻看的 3D 纸雕立体书。点开下面任意一本，每一幕都可以点按钮让它动起来。</p>
<div class="grid">
  <a class="card" href="examples/cinderella.html"><img src="docs/images/cinderella-scene3.jpg" alt="灰姑娘，南瓜变马车"><div><b>灰姑娘</b><span>佩罗童话 · 六幕</span></div></a>
  <a class="card" href="examples/tortoise-hare.html"><img src="docs/images/tortoise-scene5.jpg" alt="龟兔赛跑，乌龟冲线"><div><b>龟兔赛跑</b><span>伊索寓言 · 六幕</span></div></a>
</div>
<footer>开源地址 <a href="https://github.com/zhouwei713/popup-carousel-book">github.com/zhouwei713/popup-carousel-book</a> · MIT · 萝卜AI笔记</footer>
</main>
</body>
</html>
