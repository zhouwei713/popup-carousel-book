/* ---- walls ---- */

/* ---- audio ---- */

  chime: () => [1319, 1568, 2093].forEach((f, j) => pluck(f, j * .08, .6, 'sine', .1)),

const PENTA = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568];

/* ---- state + UI ---- */
let bookT = 0, bookTarget = 0, kU = 0, phiOpen = (180 / N) * DEG, phiTarget = phiOpen, dragging = false, readerOn = false;
const phiOf = k => (180 / N + 360 / N * k) * DEG;
const cur = () => ((kU % N) + N) % N;
const $ = id => document.getElementById(id);
const dotsEl = $('dots');
function setupUI() {
  document.title = BOOK.title; $('brandTitle').textContent = BOOK.title; $('brandSub').textContent = BOOK.subtitle || '';
  $('credit').textContent = BOOK.credit ? `© ${new Date().getFullYear()} ${BOOK.credit}` : ''; $('closeBtn').textContent = UI.close; $('rClose').textContent = UI.readerClose;
  $('prev').setAttribute('aria-label', UI.prev); $('next').setAttribute('aria-label', UI.next); $('readBtn').setAttribute('aria-label', UI.read); $('soundBtn').setAttribute('aria-label', UI.sound);
  SCN.forEach((s, i) => { const b = document.createElement('button'); b.setAttribute('aria-label', `${s.no} ${s.title}`); b.onclick = () => { if (bookTarget < 1) openBook(); goTo(kU + (((i - cur()) % N) + N + Math.floor(N / 2)) % N - Math.floor(N / 2)); }; dotsEl.appendChild(b); });
}
function updateUI() {

  $('closeBtn').hidden = !open;

  $('capTitle').textContent = open ? s.title : BOOK.title;

  $('actBtn').textContent = !open ? UI.open : (S && S.start != null ? UI.again : s.btn);
  if (readerOn) { $('rNo').textContent = open ? `${s.no} · ${cur() + 1} / ${N}` : UI.cover; $('rTitle').textContent = open ? s.title : BOOK.title; $('rText').textContent = open ? s.text : (BOOK.intro || UI.coverReader); }
}
function openBook() { if (bookTarget === 1) return; bookTarget = 1; swish(); updateUI(); }

function goTo(k) { if (k === kU) return; kU = k; phiTarget = phiOf(kU); swish(); updateUI(); }
function act() {

function bindUI() {

  $('rClose').onclick = () => { readerOn = false; $('reader').hidden = true; $('readBtn').setAttribute('aria-pressed', 'false'); };

    $('muteX').style.display = soundOn ? 'none' : ''; $('waveA').style.display = $('waveB').style.display = soundOn ? '' : 'none'; if (soundOn) pluck(880, 0, .2); };

/** #scene-3 opens straight to scene 3, #scene-3-act also plays its action, #cover keeps the book closed */

/* ---- frame loop ---- */

    S.sprites.forEach(s => { s.x = s.bx; s.y = s.by; s.d = s.bd; s.rot = s.brot; s.op = s.bop; s.sc = s.bsc; s.sy = 1; s.tint.copy(s.tintable ? S.baseTint : WHITE); });

const WHITE = new THREE.Color('#ffffff');
